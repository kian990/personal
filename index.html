  <style>
    * {
      margin: 0;
      padding: 0;

    }

    html, body {

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      text-align: center;
      padding: 1.5rem;
    }

    .name {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);

      white-space: nowrap;

    h1 {
      font-weight: 700;
      font-size: clamp(1.5rem, 5vw, 3.5rem);
      letter-spacing: -0.02em;
    }

    nav {
      margin-top: 1.25rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    nav a {

      padding: 0.08em 0.3em;

    .loader {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.6vw, 0.95rem);
      color: rgba(0, 0, 0, 0.8);
      margin-top: 1.1rem;
      white-space: pre;
      letter-spacing: 0.02em;
    }
  </style>

<body>

  </nav>
  <script>
    (function () {
      const el = document.getElementById('loader');
      const WIDTH = 22;
      const PARTIALS = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
      const CYCLE = 6000;

      function frame(now) {
        const t = (now % CYCLE) / CYCLE;
        // ease-in-out so the fill breathes instead of marching linearly
        const p = t < 0.85 ? (1 - Math.cos((t / 0.85) * Math.PI)) / 2 : 1;
        const cells = p * WIDTH;
        const full = Math.floor(cells);
        const frac = Math.floor((cells - full) * 8);
        let bar = '█'.repeat(full) + PARTIALS[frac];
        bar += '░'.repeat(Math.max(0, WIDTH - bar.length));
        el.textContent = '[' + bar + '] ' + String(Math.round(p * 99)).padStart(2, ' ') + '%';
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
